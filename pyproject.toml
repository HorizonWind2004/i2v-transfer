[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "i2vt"
dynamic = ["version"]
description = "Improving and Expanding Video Editing Capabilities Without Videos"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
training = [
    "torch", "torchvision", "numpy", "Pillow", "omegaconf", "safetensors", "transformers==4.57.0",
    "diffusers==0.36.0", "pyarrow", "einops", "ftfy", "accelerate", "wandb", "loguru", "tqdm",
    "huggingface_hub", "imageio", "imageio-ffmpeg", "decord",
]
evaluation = ["google-genai>=1.0,<2"]
dev = ["pytest", "ruff"]

[project.urls]
Homepage = "https://i2v-transfer.github.io/"
Paper = "https://arxiv.org/abs/2611.34941"
Repository = "https://github.com/HorizonWind2004/i2v-transfer"

[project.scripts]
i2vt = "i2vt.run:main"

[tool.setuptools.dynamic]
version = {attr = "i2vt.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 119
target-version = "py310"
src = ["src", "."]
extend-exclude = ["**/vendor/**"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.package-data]
"i2vt.vendor.bernini" = ["LICENSE", "SOURCE"]
"i2vt.vendor.joyedit" = ["LICENSE", "SOURCE"]
"i2vt.vendor.wan" = ["LICENSE", "SOURCE", "config/wan2.1/*.yaml"]
